# Local development broker.
#
# Anonymous access is enabled because nothing sensitive crosses this broker in
# development and a hackathon team should not be blocked on credential setup.
# A real deployment MUST replace this with per-device credentials or mTLS —
# AIS-140 units authenticate individually, and an open broker would let anyone
# inject fake vehicle positions.

listener 1883
protocol mqtt

# WebSocket listener, so a browser-based debug client can watch the raw GPS feed.
listener 9001
protocol websockets

allow_anonymous true

persistence false
log_dest stdout
log_type warning
log_type error
connection_messages false
